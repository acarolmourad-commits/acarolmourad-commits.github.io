name: Uptime Watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar lista de domínios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          subs=$(gh api "users/${{ github.repository_owner }}/repos?per_page=100" --paginate --jq '.[].name | select(startswith("asf-")) | select(. != "asf-pr53-preview" and . != "asf-eventos" and . != "asf-app-redirect") | sub("^asf-";"") + ".asf.surf"')
          printf "asf.surf\n%s" "$subs" | sort -u > domains.txt
          echo "Monitorando $(wc -l < domains.txt) domínios"
      - name: Checar uptime (HTTP)
        run: |
          down=0; total=0
          echo "| Domínio | HTTP | Tempo | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          while read -r d; do
            [ -z "$d" ] && continue
            total=$((total+1))
            read -r code t < <(curl -sk -o /dev/null -w '%{http_code} %{time_total}' --max-time 20 "https://$d" || echo "000 0")
            code=${code:-000}; t=${t:-0}
            if [ "$code" = "200" ]; then
              echo "| $d | $code | ${t}s | UP |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $d | $code | ${t}s | DOWN |" >> $GITHUB_STEP_SUMMARY
              down=$((down+1))
            fi
          done < domains.txt
          echo "**Resumo:** $((total-down))/$total no ar" >> $GITHUB_STEP_SUMMARY
          echo "UP=$((total-down))/$total DOWN=$down"
          [ "$down" -eq 0 ]
