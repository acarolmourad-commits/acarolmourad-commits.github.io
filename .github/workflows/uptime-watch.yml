name: Uptime Watch

on:
  schedule:
    - cron: '*/30 * * * *' # a cada 30 min
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar lista de dominios configurados no Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repos=$(gh api "users/$OWNER/repos?per_page=100" --paginate \
            --jq '.[].name | select(startswith("asf-"))')
          : > domains.txt
          while IFS= read -r repo || [ -n "$repo" ]; do
            [ -z "$repo" ] && continue
            domain=$(gh api "repos/$OWNER/$repo/pages" --jq '.cname // empty') || { echo "Pages lookup failed: $repo" >&2; exit 1; }
            if [ -z "$domain" ]; then
              echo "No custom domain configured: $repo" >&2
              continue
            fi
            case "$domain" in
              *[!a-zA-Z0-9.-]*|.*|*.) echo "Invalid custom domain for $repo" >&2; exit 1 ;;
            esac
            printf '%s\n' "$domain" >> domains.txt
            echo "$repo -> $domain"
          done <<< "$repos"
          sort -u domains.txt -o domains.txt
          [ -s domains.txt ] || { echo 'No configured domains found' >&2; exit 1; }
          echo "Configured domains: $(wc -l < domains.txt)"
      - name: Checar uptime (HTTP)
        run: |
          down=0; total=0
          echo "| Domínio | HTTP | Tempo | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r d || [ -n "$d" ]; do
            [ -z "$d" ] && continue
            total=$((total+1))
            # -k: tolera cert errado enquanto os certs próprios não saem (o SSL Watch cuida disso)
            rc=0
            result=$(curl -sk -o /dev/null -w '%{http_code} %{time_total}' --max-time 20 "https://$d") || rc=$?
            read -r code t <<< "${result:-000 0}"
            echo "$d: curl_exit=$rc http=$code time=${t:-0}"
            if [ "$rc" -eq 0 ] && [ "$code" = "200" ]; then
              echo "| $d | $code | ${t}s | 🟢 |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $d | $code | ${t}s | 🔴 DOWN |" >> $GITHUB_STEP_SUMMARY
              down=$((down+1))
            fi
          done < domains.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Resumo:** $((total-down))/$total no ar" >> $GITHUB_STEP_SUMMARY
          echo "UP=$((total-down))/$total DOWN=$down"
          [ "$down" -eq 0 ]
