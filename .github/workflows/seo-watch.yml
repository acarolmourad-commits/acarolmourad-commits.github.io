name: SEO & Index Watch

on:
  schedule:
    - cron: '0 14 * * *' # 11h BRT (14h UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  seo-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar lista de dominios configurados no Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repos=$(gh api "users/$OWNER/repos?per_page=100" --paginate \
            --jq '.[].name | select(startswith("asf-"))')
          : > domains.txt
          while IFS= read -r repo || [ -n "$repo" ]; do
            [ -z "$repo" ] && continue
            domain=$(gh api "repos/$OWNER/$repo/pages" --jq '.cname // empty') || { echo "Pages lookup failed: $repo" >&2; exit 1; }
            if [ -z "$domain" ]; then
              echo "No custom domain configured: $repo" >&2
              continue
            fi
            case "$domain" in
              *[!a-zA-Z0-9.-]*|.*|*.) echo "Invalid custom domain for $repo" >&2; exit 1 ;;
            esac
            printf '%s\n' "$domain" >> domains.txt
            echo "$repo -> $domain"
          done <<< "$repos"
          sort -u domains.txt -o domains.txt
          [ -s domains.txt ] || { echo 'No configured domains found' >&2; exit 1; }
          echo "Configured domains: $(wc -l < domains.txt)"
      - name: Checar sitemap.xml e robots.txt de cada domínio
        run: |
          sm_ok=0; rb_ok=0; miss=0; network_errors=0
          : > sitemaps_ok.txt
          echo "| Domínio | sitemap.xml | robots.txt |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r d || [ -n "$d" ]; do
            [ -z "$d" ] && continue
            sm_rc=0
            sm=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://$d/sitemap.xml") || sm_rc=$?
            if [ "$sm_rc" -ne 0 ]; then
              sm=000
              network_errors=$((network_errors+1))
              echo "$d/sitemap.xml: curl_exit=$sm_rc"
            fi
            rb_rc=0
            rb=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://$d/robots.txt") || rb_rc=$?
            if [ "$rb_rc" -ne 0 ]; then
              rb=000
              network_errors=$((network_errors+1))
              echo "$d/robots.txt: curl_exit=$rb_rc"
            fi
            smi=$([ "$sm" = "200" ] && echo "✅" || echo "⚠️ $sm")
            rbi=$([ "$rb" = "200" ] && echo "✅" || echo "⚠️ $rb")
            if [ "$sm" = "200" ]; then
              sm_ok=$((sm_ok+1))
              echo "$d" >> sitemaps_ok.txt
            fi
            [ "$rb" = "200" ] && rb_ok=$((rb_ok+1))
            { [ "$sm" != "200" ] || [ "$rb" != "200" ]; } && miss=$((miss+1))
            echo "| $d | $smi | $rbi |" >> $GITHUB_STEP_SUMMARY
          done < domains.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Resumo:** sitemaps OK: $sm_ok · robots OK: $rb_ok · domínios com algo faltando: $miss" >> $GITHUB_STEP_SUMMARY
          echo "Falhas de transporte: $network_errors" >> $GITHUB_STEP_SUMMARY
          [ "$miss" -eq 0 ] && [ "$network_errors" -eq 0 ]

      - name: Reenviar sitemaps ao Search Console (sc-domain:asf.surf)
        env:
          SC_TOKEN: ${{ secrets.GOOGLE_SC_TOKEN }}
        run: |
          echo "## 📤 Reenvio de sitemaps" >> $GITHUB_STEP_SUMMARY
          if [ -z "$SC_TOKEN" ]; then
            echo "⚠️ Secret \`GOOGLE_SC_TOKEN\` não configurado — etapa ignorada." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          site="sc-domain%3Aasf.surf"
          sent=0; err=0
          while IFS= read -r d || [ -n "$d" ]; do
            [ -z "$d" ] && continue
            feed=$(python3 -c "import urllib.parse;print(urllib.parse.quote('https://$d/sitemap.xml', safe=''))")
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X PUT \
              -H "Authorization: Bearer $SC_TOKEN" \
              "https://www.googleapis.com/webmasters/v3/sites/$site/sitemaps/$feed")
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then
              echo "📤 $d/sitemap.xml reenviado"
              sent=$((sent+1))
            else
              echo "❌ $d: HTTP $code"
              err=$((err+1))
            fi
            sleep 1 # respeitar rate limit da API
          done < sitemaps_ok.txt
          echo "**Reenviados:** $sent · **Falhas:** $err" >> $GITHUB_STEP_SUMMARY

      - name: Search Console — estatísticas de indexação (requer secret GOOGLE_SC_TOKEN)
        env:
          SC_TOKEN: ${{ secrets.GOOGLE_SC_TOKEN }}
        run: |
          echo "## 📈 Indexação (Google Search Console)" >> $GITHUB_STEP_SUMMARY
          if [ -z "$SC_TOKEN" ]; then
            echo "⚠️ Secret \`GOOGLE_SC_TOKEN\` não configurado — etapa ignorada." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "| Sitemap | Páginas enviadas | Erros |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          curl -s --max-time 20 -H "Authorization: Bearer $SC_TOKEN" \
            "https://www.googleapis.com/webmasters/v3/sites/sc-domain%3Aasf.surf/sitemaps" \
            | jq -r '.sitemap[]? | "| \(.path) | \(.contents[0].submitted // "?") | \(.errors // 0) |"' \
            >> $GITHUB_STEP_SUMMARY \
            || echo "⚠️ Falha ao consultar API (token expirado?)" >> $GITHUB_STEP_SUMMARY
