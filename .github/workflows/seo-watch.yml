name: SEO & Index Watch

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar lista de domínios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          subs=$(gh api "users/${{ github.repository_owner }}/repos?per_page=100" --paginate --jq '.[].name | select(startswith("asf-")) | select(. != "asf-pr53-preview" and . != "asf-eventos" and . != "asf-app-redirect") | sub("^asf-";"") + ".asf.surf"')
          printf "asf.surf\n%s" "$subs" | sort -u > domains.txt
      - name: Checar sitemap.xml e robots.txt de cada domínio
        run: |
          sm_ok=0; rb_ok=0; miss=0
          : > sitemaps_ok.txt
          echo "| Domínio | sitemap.xml | robots.txt |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          while read -r d; do
            [ -z "$d" ] && continue
            sm=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://$d/sitemap.xml" || echo 000)
            rb=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://$d/robots.txt" || echo 000)
            smi=$([ "$sm" = "200" ] && echo "OK" || echo "$sm")
            rbi=$([ "$rb" = "200" ] && echo "OK" || echo "$rb")
            if [ "$sm" = "200" ]; then sm_ok=$((sm_ok+1)); echo "$d" >> sitemaps_ok.txt; fi
            [ "$rb" = "200" ] && rb_ok=$((rb_ok+1))
            { [ "$sm" != "200" ] || [ "$rb" != "200" ]; } && miss=$((miss+1))
            echo "| $d | $smi | $rbi |" >> $GITHUB_STEP_SUMMARY
          done < domains.txt
          echo "**Resumo:** sitemaps OK: $sm_ok · robots OK: $rb_ok · domínios com algo faltando: $miss" >> $GITHUB_STEP_SUMMARY
