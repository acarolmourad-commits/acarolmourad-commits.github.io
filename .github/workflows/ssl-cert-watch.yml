name: SSL Cert Watch

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-certs:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar lista de domínios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          subs=$(gh api "users/${{ github.repository_owner }}/repos?per_page=100" --paginate --jq '.[].name | select(startswith("asf-")) | select(. != "asf-pr53-preview" and . != "asf-eventos" and . != "asf-app-redirect" and . != "asf-clube") | sub("^asf-";"") + ".asf.surf"')
          printf "asf.surf\n%s" "$subs" | sort -u > domains.txt
          echo "Total: $(wc -l < domains.txt) domínios"
      - name: Checar certificado SSL de cada domínio
        run: |
          ok=0; pend=0; fail=0
          : > ready.txt
          echo "| Domínio | Certificado | Status HTTPS |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          while read -r d; do
            [ -z "$d" ] && continue
            cn=$(echo | timeout 15 openssl s_client -connect "$d:443" -servername "$d" 2>/dev/null | openssl x509 -noout -subject 2>/dev/null | sed 's/.*CN *= *//' || true)
            if [ -z "$cn" ]; then
              echo "| $d | sem resposta TLS | falha |" >> $GITHUB_STEP_SUMMARY
              fail=$((fail+1)); continue
            fi
            if echo "$cn" | grep -q "github.io"; then
              echo "| $d | $cn (cert do GitHub) | pendente |" >> $GITHUB_STEP_SUMMARY
              pend=$((pend+1))
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$d" || echo 000)
              echo "| $d | $cn | HTTP $code |" >> $GITHUB_STEP_SUMMARY
              ok=$((ok+1)); echo "$d" >> ready.txt
            fi
          done < domains.txt
          echo "**Resumo:** $ok com cert próprio - $pend pendentes - $fail falhas" >> $GITHUB_STEP_SUMMARY
          echo "OK=$ok PENDENTES=$pend FALHAS=$fail"
          [ "$fail" -eq 0 ]
      - name: Ativar Enforce HTTPS nos repos cujo certificado já saiu
        env:
          GH_TOKEN: ${{ secrets.PAGES_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret PAGES_PAT nao configurado - etapa ignorada." >> $GITHUB_STEP_SUMMARY
            echo "Crie um PAT com acesso aos repos e salve como secret PAGES_PAT." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          enabled=0
          while read -r d; do
            [ -z "$d" ] && continue
            [ "$d" = "asf.surf" ] && repo="${OWNER}.github.io" || repo="asf-${d%.asf.surf}"
            current=$(gh api "repos/$OWNER/$repo/pages" --jq '.https_enforced' 2>/dev/null || echo "erro")
            if [ "$current" = "true" ]; then
              echo "$repo: Enforce HTTPS ja ativo"
              continue
            fi
            if [ "$current" = "erro" ]; then
              echo "$repo: nao foi possivel ler Pages (repo sem Pages ou sem permissao)"
              continue
            fi
            if gh api -X PUT "repos/$OWNER/$repo/pages" -f https_enforced=true > /dev/null 2>&1; then
              echo "$repo: Enforce HTTPS ATIVADO ($d)"
              echo "- $d: Enforce HTTPS ativado" >> $GITHUB_STEP_SUMMARY
              enabled=$((enabled+1))
            else
              echo "$repo: falha ao ativar"
            fi
          done < ready.txt
          echo "Total ativados nesta execucao: $enabled"
