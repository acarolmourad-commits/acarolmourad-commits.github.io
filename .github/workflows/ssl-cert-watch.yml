name: SSL Cert Watch

on:
  schedule:
    - cron: '0 13 * * *' # 10h BRT (13h UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  check-certs:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar lista de dominios configurados no Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repos=$(gh api "users/$OWNER/repos?per_page=100" --paginate \
            --jq '.[].name | select(startswith("asf-"))')
          : > domains.txt
          while IFS= read -r repo || [ -n "$repo" ]; do
            [ -z "$repo" ] && continue
            domain=$(gh api "repos/$OWNER/$repo/pages" --jq '.cname // empty') || { echo "Pages lookup failed: $repo" >&2; exit 1; }
            if [ -z "$domain" ]; then
              echo "No custom domain configured: $repo" >&2
              continue
            fi
            case "$domain" in
              *[!a-zA-Z0-9.-]*|.*|*.) echo "Invalid custom domain for $repo" >&2; exit 1 ;;
            esac
            printf '%s\n' "$domain" >> domains.txt
            echo "$repo -> $domain"
          done <<< "$repos"
          sort -u domains.txt -o domains.txt
          [ -s domains.txt ] || { echo 'No configured domains found' >&2; exit 1; }
          echo "Configured domains: $(wc -l < domains.txt)"

      - name: Read-only strict TLS and transport check
        run: |
          ok=0; fail=0
          printf '| Domain | HTTP | curl exit | TLS/transport |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r domain || [ -n "$domain" ]; do
            [ -z "$domain" ] && continue
            rc=0
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://$domain") || rc=$?
            if [ "$rc" -eq 0 ]; then
              ok=$((ok+1)); status='TLS verified; HTTP status reported separately'
            else
              fail=$((fail+1)); status='DNS/transport/TLS failure'
            fi
            printf '| %s | %s | %s | %s |\n' "$domain" "${code:-000}" "$rc" "$status" >> "$GITHUB_STEP_SUMMARY"
          done < domains.txt
          printf '\nVerified: %s; failures: %s\n' "$ok" "$fail" >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ]
