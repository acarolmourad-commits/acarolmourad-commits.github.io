<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASF Galeria — Mural das Manas 🏄‍♀️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#0a2540,#0e4d64 60%,#12726b); min-height:100vh; color:#fff; padding:20px; }
  header { text-align:center; padding:30px 0 20px; }
  header h1 { font-size:2.2rem; }
  header p { opacity:.8; margin-top:6px; }
  .form-card { max-width:520px; margin:0 auto 30px; background:rgba(255,255,255,.08); border-radius:16px; padding:20px; backdrop-filter:blur(8px); }
  .form-card input, .form-card textarea { width:100%; padding:12px; margin:8px 0; border:none; border-radius:10px; background:rgba(255,255,255,.15); color:#fff; font-size:1rem; }
  .form-card input::placeholder,.form-card textarea::placeholder { color:rgba(255,255,255,.6); }
  .form-card button { width:100%; padding:14px; border:none; border-radius:10px; background:#ff6b6b; color:#fff; font-size:1.05rem; font-weight:700; cursor:pointer; margin-top:8px; }
  .form-card button:hover { background:#ff8787; }
  .grid { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
  .post { background:rgba(255,255,255,.1); border-radius:16px; overflow:hidden; }
  .post img { width:100%; height:auto; max-height:520px; object-fit:contain; display:block; background:rgba(0,0,0,.35); }
  .post-body { padding:16px; }
  .post-body h3 { font-size:1.1rem; }
  .post-body .pico { color:#7fd8ff; font-size:.9rem; margin:2px 0 8px; }
  .stoke { background:none; border:2px solid #ff6b6b; color:#ff6b6b; border-radius:20px; padding:6px 14px; cursor:pointer; font-weight:700; margin-top:10px; }
  .stoke:hover { background:#ff6b6b; color:#fff; }
  .comments { margin-top:12px; border-top:1px solid rgba(255,255,255,.15); padding-top:10px; }
  .comment { font-size:.85rem; padding:4px 0; opacity:.9; }
  .comment b { color:#7fd8ff; }
  .comment-form { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .comment-form input { padding:10px; border:none; border-radius:8px; background:rgba(255,255,255,.15); color:#fff; font-size:16px; } .comment-form input.cname { width:100%; } .comment-form input.ctext { flex:1; min-width:0; }
  .comment-form button { padding:8px 12px; border:none; border-radius:8px; background:#0e4d64; color:#fff; cursor:pointer; }
  #status { text-align:center; margin:10px 0; min-height:20px; }
</style>
</head>
<body>
<div id="asf-nav"></div>
<script src="https://acarolmourad-commits.github.io/asf-nav.js"></script>
<header>
  <h1>🏄‍♀️ ASF Galeria</h1>
  <p>Mural colaborativo — poste sua foto, compartilhe o stoke!</p>
</header>

<div class="form-card">
  <input id="nome" placeholder="Seu nome" maxlength="60">
  <input id="pico" placeholder="Pico (ex: Praia do Rosa)" maxlength="80">
  <textarea id="cap" placeholder="Legenda..." rows="2" maxlength="300"></textarea>
  <input id="foto" type="file" accept="image/*">
  <button onclick="publicar()">Postar no mural 🤙</button>
  <div id="status"></div>
</div>

<div class="grid" id="mural"></div>

<script>
const SUPABASE_URL = 'https://qktabrzbgdfndklytwub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdGFicnpiZ2RmbmRrbHl0d3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDk3MjQsImV4cCI6MjEwNjIyNTcyNH0.yMbCTNEOfOyETBZqm7cI9IXfFGjJu6zYRDOcZlJlSBE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const statusEl = document.getElementById('status');

async function carregar() {
  const { data: posts, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
  if (error) { statusEl.textContent = 'Erro ao carregar: ' + error.message; return; }
  const { data: comments } = await sb.from('comments').select('*').order('created_at');
  const mural = document.getElementById('mural');
  mural.innerHTML = '';
  (posts || []).forEach(p => {
    const cs = (comments || []).filter(c => c.post_id === p.id);
    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
      ${p.img_url ? `<img src="${p.img_url}" alt="">` : ''}
      <div class="post-body">
        <h3>${esc(p.nome)}</h3>
        <div class="pico">📍 ${esc(p.pico || '')}</div>
        <p>${esc(p.cap || '')}</p>
        <button class="stoke" onclick="stoke('${p.id}', ${p.stoke || 0})">🔥 Stoke (${p.stoke || 0})</button>
        <div class="comments">
          ${cs.map(c => `<div class="comment"><b>${esc(c.nome)}:</b> ${esc(c.texto)}</div>`).join('')}
          <div class="comment-form">
            <input class="cname" placeholder="Seu nome" id="cn-${p.id}" maxlength="60">
            <input class="ctext" placeholder="Escreva um comentário..." id="ct-${p.id}" maxlength="200">
            <button onclick="comentar('${p.id}')">➤</button>
          </div>
        </div>
      </div>`;
    mural.appendChild(div);
  });
}

function esc(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function publicar() {
  const nome = document.getElementById('nome').value.trim();
  const pico = document.getElementById('pico').value.trim();
  const cap = document.getElementById('cap').value.trim();
  const file = document.getElementById('foto').files[0];
  if (!nome) { statusEl.textContent = 'Coloca seu nome!'; return; }
  statusEl.textContent = 'Publicando...';
  let img_url = null;
  if (file) {
    const path = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_')}`;
    const { error: upErr } = await sb.storage.from('fotos').upload(path, file);
    if (upErr) { statusEl.textContent = 'Erro no upload: ' + upErr.message; return; }
    img_url = `${SUPABASE_URL}/storage/v1/object/public/fotos/${path}`;
  }
  const { error } = await sb.from('posts').insert({ nome, pico, cap, img_url });
  if (error) { statusEl.textContent = 'Erro: ' + error.message; return; }
  statusEl.textContent = 'Postado! 🤙';
  document.getElementById('cap').value = ''; document.getElementById('foto').value = '';
  carregar();
}

async function stoke(id, atual) {
  await sb.from('posts').update({ stoke: atual + 1 }).eq('id', id);
  carregar();
}

async function comentar(id) {
  const nomeEl = document.getElementById('cn-' + id);
  const textoEl = document.getElementById('ct-' + id);
  if (!nomeEl || !textoEl) { alert('Erro interno: campo nao encontrado'); return; }
  const nome = nomeEl.value.trim();
  const texto = textoEl.value.trim();
  if (!nome || !texto) { alert('Preencha nome e comentario!'); return; }
  const { error } = await sb.from('comments').insert({ post_id: Number(id), nome, texto });
  if (error) { alert('Erro ao comentar: ' + error.message); return; }
  carregar();
}

sb.channel('mural').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, carregar).subscribe();
carregar();
</script>
</body>
</html>
